publish_to: none

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  sembast: ^3.7.0
  path_provider: ^2.1.0
  path: ^1.9.0
  uuid: ^4.4.0
  intl: ">=0.19.0 <1.0.0"
