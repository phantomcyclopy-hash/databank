name: Build IBMMKAR App

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.6'
          channel: 'stable'

      - name: Regenerate Android platform files
        run: flutter create --platforms=android --project-name=databank_app .

      # O flutter create recria o manifesto com o nome do pacote; aqui
      # aplicamos o nome IBMMKAR e os ícones versionados em tool/icones_nativos.
      - name: Apply IBMMKAR name and icons (Android)
        run: |
          sed -i 's/android:label="[^"]*"/android:label="IBMMKAR"/' android/app/src/main/AndroidManifest.xml
          # Permissão de internet (o template só a inclui nos builds de depuração)
          grep -q "android.permission.INTERNET" android/app/src/main/AndroidManifest.xml || \
            sed -i 's#<application#<uses-permission android:name="android.permission.INTERNET"/>\n    <application#' android/app/src/main/AndroidManifest.xml
          # google_sign_in exige minSdk 21
          sed -i -E 's/minSdkVersion[ =]+flutter\.minSdkVersion/minSdkVersion 21/' android/app/build.gradle
          for d in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            cp tool/icones_nativos/android/mipmap-$d/ic_launcher.png android/app/src/main/res/mipmap-$d/ic_launcher.png
          done
      # Chave de assinatura FIXA (tool/debug.keystore). Sem ela, cada build sai
      # assinado com uma chave nova e o Android não deixa atualizar o app por
      # cima do anterior (precisaria desinstalar e perder os dados).
      - name: Use fixed signing key
        run: |
          mkdir -p "$HOME/.android"
          cp tool/debug.keystore "$HOME/.android/debug.keystore"
      - run: flutter pub get
      - run: flutter build apk --release --build-number=${{ github.run_number }}

      - uses: actions/upload-artifact@v4
        with:
          name: IBMMKAR-Android-APK
          path: build/app/outputs/flutter-apk/app-release.apk

  build-windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.6'
          channel: 'stable'

      - name: Regenerate Windows platform files
        run: flutter create --platforms=windows --project-name=databank_app .

      - name: Apply IBMMKAR name and icon (Windows)
        shell: bash
        run: |
          sed -i 's/L"databank_app"/L"IBMMKAR"/' windows/runner/main.cpp
          sed -i 's/set(BINARY_NAME "databank_app")/set(BINARY_NAME "IBMMKAR")/' windows/CMakeLists.txt
          sed -i -E 's/"databank_app(\.exe)?"/"IBMMKAR\1"/' windows/runner/Runner.rc
          cp tool/icones_nativos/windows/app_icon.ico windows/runner/resources/app_icon.ico
      - run: flutter pub get
      - run: flutter build windows --release --build-number=${{ github.run_number }}

      - uses: actions/upload-artifact@v4
        with:
          name: IBMMKAR-Windows-EXE
          path: build/windows/x64/runner/Release/
